[package]
name = "hi-log"
version = "0.1.0"
edition = "2021"
description = "hi-log 桌面壳"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hi-log-core = { path = "../core" }

[dev-dependencies]
tempfile = "3"
